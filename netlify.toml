[build]
  publish = "."
  functions = "netlify/functions"

# Friendlier paths for the booking endpoints.
[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

[[redirects]]
  from = "/api/book"
  to = "/.netlify/functions/book"
  status = 200

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200
