<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<link rel="canonical" href="index.html?view=book">
<script>
(function () {
    var p = new URLSearchParams(location.search);
    var out = new URLSearchParams();
    out.set('view', p.get('view') || 'book');
    if (p.get('lang') === 'es') out.set('lang', 'es');
    location.replace('index.html?' + out.toString());
})();
</script>
<meta http-equiv="refresh" content="0; url=index.html?view=book">
</head>
<body style="background:#000;color:#fff;font-family:Inter,sans-serif;padding:40px">
<p>Redirecting to <a href="index.html?view=book" style="color:#d4af37">booking</a>…</p>
</body>
</html>
